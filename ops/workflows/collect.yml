# Copy to .github/workflows/collect.yml
# Reads every bank's official rate page, stores changes in data/rates (and deposit terms in
# data/terms), updates data/snapshots, reports to Convex; once a day also refreshes Government
# scheme rates, EPF, CPI inflation, NPS NAVs, RBI policy rates and RBI's bank list; then commits
# all data changes back to the repo (an auditable history).
name: Collect rates

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST daily — all bank pages
    - cron: "50 4 * * 1-6" # 10:20 IST Mon–Sat — bulk-deposit rates (RBI: posted by 10:10 AM each business day)
  workflow_dispatch:
    inputs:
      scope:
        description: "all | bulk | macro | <bank-slug>"
        default: "all"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install headless browser (for script-rendered bank pages)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Run bank collectors
        if: inputs.scope != 'macro'
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          SCOPE: ${{ inputs.scope }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "50 4 * * 1-6" ] || [ "$SCOPE" = "bulk" ]; then
            npx tsx collectors/src/run.ts --cadence bulk_daily
          elif [ -n "$SCOPE" ] && [ "$SCOPE" != "all" ]; then
            npx tsx collectors/src/run.ts --bank "$SCOPE"
          else
            npx tsx collectors/src/run.ts
          fi
      - name: Run scheme, inflation, NPS and RBI collectors
        # Daily run and manual "all"/"macro" runs only (not the 10:20 bulk-rate run). A failing
        # government site never blocks the bank data from being committed.
        if: ${{ !cancelled() && github.event.schedule != '50 4 * * 1-6' && (github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'macro') }}
        continue-on-error: true
        run: npx tsx collectors/src/run-macro.ts
      - name: Commit data changes
        # Also after a failed step: everything stored was validated first, so partial progress is kept.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "fixed-return-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No rate changes."
          else
            git commit -m "data: rates $(TZ=Asia/Kolkata date +%F)"
            git pull --rebase
            git push
          fi
